[project]
name = "oyster-data"
version = "0.1.0"
description = "Download and clean public data into OysterFarming data contract files"
readme = "README.md"
authors = [
    { name = "JRock95", email = "jmurphy6895@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=17",
]

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
