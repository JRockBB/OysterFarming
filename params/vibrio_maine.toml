source = "Maine DMR Rules Ch. 115 (as amended 2024-03-19), section 115.05: shellstock exposed more than 2 hours but less than 12 hours must be resubmerged on the lease for no less than 24 hours or destroyed"

[resubmerge_long_h]
value = 168.0
units = "h"
source = "Maine DMR Rules Ch. 115 (as amended 2024-03-19), section 115.05: exposure of 12 hours or more requires resubmersion for no less than seven (7) days (168 hours) or destruction"
