title = "Maine Vibrio parahaemolyticus control rule for oysters (PLAN.md P4.5)"
notes = "Maine DMR Rules Chapter 115, Vibrio Control Plan, consolidated text as amended March 19, 2024 (statewide for oysters since that amendment; rule first effective January 1, 2016). https://www1.maine.gov/dmr/sites/maine.gov.dmr/files/inline-files/Chapter115_03192024.pdf. Applied to every simulated year as the current regulatory regime."

