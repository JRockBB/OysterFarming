title = "DEB parameters for the eastern oyster Crassostrea virginica (Lavaud et al. 2017)"
species = "C_virginica"
status = "INCOMPLETE: entries marked TODO(source) block loading until resolved."

# Values are from Lavaud et al. 2017 (Ecol. Model. 363:221-233, doi:10.1016/j.ecolmodel.2017.09.003) as reproduced in
# Table A2 of Lavaud, R., La Peyre, M.K., Justic, D., La Peyre, J.F., 2021. Dynamic Energy Budget modelling to predict
# eastern oyster growth, reproduction, and mortality under river management and climate change scenarios. Estuar.
# Coast. Shelf Sci. (https://www.sciencedirect.com/science/article/pii/S027277142100024X; author manuscript at
# https://repository.library.noaa.gov/view/noaa/60944). Check each value against the 2017 Supplementary Information.
#
# Lavaud et al. use maturity energy (E_H^p = 369.9 J, k_J = 0.002 d^-1) and a separate gonad compartment, which this
# package's model does not implement yet. The entries the current model needs but that have no equivalent in that
# formulation are marked TODO(source) rather than guessed.

