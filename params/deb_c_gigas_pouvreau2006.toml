notes = "Derived: structure density 1 g wet cm^-3 times 0.15 g dry per g wet."

[GSI_spawn]
value = 0.35
units = "1"
source = "Pouvreau et al. 2006, J. Sea Res. 56:156-167, Table 1 (authors' unpublished data)"
notes = "Paper gives 35 percent. Bourles et al. 2009 refit this to 40 percent for a coastal pond."

[T_spawn_c]
value = 20.0
units = "degC"
source = "Pouvreau et al. 2006, J. Sea Res. 56:156-167, Table 1 (authors' unpublished data)"
notes = "Bourles et al. 2009 refit this to 22 degC for a coastal pond."
