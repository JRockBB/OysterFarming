title = "Nitrogen in harvested oysters: Chesapeake Bay Oyster BMP Expert Panel defaults"

# Citations
#  First report: Reichert-Nguyen, J., Cornwell, J., et al. 2016. Panel Recommendations on the Oyster BMP Nutrient
#    and Suspended Sediment Reduction Effectiveness Determination Decision Framework and Nitrogen and Phosphorus
#    Assimilation in Oyster Tissue Reduction Effectiveness for Oyster Aquaculture Practices. Oyster BMP Expert Panel
#    First Report, approved 19 Dec 2016. Chesapeake Bay Program.
#  Second report: Oyster BMP Expert Panel Second Report, approved by WTWG 4 May 2023. Chesapeake Bay Program.
#
# Regressions are DW (g) = a * SH(mm)^b, 50th quantile, fitted to Chesapeake Bay oysters. Applying them to Maine
# oysters is an assumption; the panel itself recommends site-specific estimates where available.

[tissue_dw_a_diploid]
value = 0.0004
units = "g mm^-b"
source = "Oyster BMP Expert Panel First Report 2016, Table 2b footnote (p. 19); diploid 50th quantile regression"

[tissue_dw_b_diploid]
value = 1.82
units = "1"
source = "Oyster BMP Expert Panel First Report 2016, Table 2b footnote (p. 19); diploid 50th quantile regression"

[tissue_dw_a_triploid]
value = 0.00005
units = "g mm^-b"
source = "Oyster BMP Expert Panel First Report 2016, Table 2b footnote (p. 19); triploid 50th quantile regression"

[tissue_dw_b_triploid]
value = 2.39
units = "1"
source = "Oyster BMP Expert Panel First Report 2016, Table 2b footnote (p. 19); triploid 50th quantile regression"

[tissue_n_fraction]
value = 0.082
units = "g N g^-1 DW"
source = "Oyster BMP Expert Panel First Report 2016, Table 2b footnote (p. 19): 8.2% mean N in tissue dry weight"

[shell_dw_a]
value = 0.00147
units = "g mm^-b"
source = "Oyster BMP Expert Panel Second Report 2023, Table 7.2 and Table E-1; Bay-wide shell 50th quantile regression"
notes = "Developed for oyster reef restoration practices, not aquaculture. Shell credit is optional in this package."

[shell_dw_b]
value = 2.3964
units = "1"
source = "Oyster BMP Expert Panel Second Report 2023, Table 7.2 and Table E-1; Bay-wide shell 50th quantile regression"

[shell_n_fraction]
value = 0.002
units = "g N g^-1 DW"
source = "Oyster BMP Expert Panel Second Report 2023, section 7.2.8 (p. 61): 0.2% mean N in shell dry weight"
