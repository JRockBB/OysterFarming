title = "Dermo establishment model with the symbolic transmission formula (PLAN.md P4.2f)"
notes = "Transmission multiplier g(T, S) = max(0, exp(g_a - exp(T - S + g_c)) + g_d + g_e * S) on the waterborne infection rate. Passed the held-out Great Bay test by about 1 % (0.207 vs 0.209 persistence); fails in Maryland; its temperature dependence is implausible (highest in cold water). Use only as a 'with Dermo' scenario."

